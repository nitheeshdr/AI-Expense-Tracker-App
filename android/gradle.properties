org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Play Console pre-launch report: "Improve your app's memory and performance
# with R8 optimization" — folds resource shrinking into R8's reference graph
# (AGP already runs isMinifyEnabled/isShrinkResources by default via the
# Flutter Gradle plugin; this makes that pass more precise instead of the
# separate AAPT2-generated keep rules). Available from AGP 8.12; automatic
# on AGP 9.0+, so this line becomes a no-op if AGP is bumped that far later.
#
# Disabled for now: this pass took 45+ minutes on this project's dependency
# graph (a much heavier reference-graph analysis than the standard resource
# shrinker) with no end in sight, and a smaller/faster install isn't worth
# blocking the Play Store upload over. Re-enable and let it run to
# completion when there's no submission deadline.
# android.r8.optimizedResourceShrinking=true
