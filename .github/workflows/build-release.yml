name: Build & Release Signed APK/AAB

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Signed Flutter App
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java 17 ──────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Set up Flutter ──────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      # ── 4. Restore keystore from secret ───────────────────────────────────
      - name: Decode & place keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > android/app/upload-keystore.jks

      # ── 5. Write key.properties ────────────────────────────────────────────
      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # ── 6. Get dependencies ────────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── 7. Build signed APK ────────────────────────────────────────────────
      - name: Build signed APK
        run: flutter build apk --release

      # ── 8. Build signed AAB ────────────────────────────────────────────────
      - name: Build signed AAB (App Bundle)
        run: flutter build appbundle --release

      # ── 9. Rename artifacts with version ──────────────────────────────────
      - name: Rename artifacts
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/ai-expense-tracker-${VERSION}.apk
          cp build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/ai-expense-tracker-${VERSION}.aab
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      # ── 10. Upload APK as workflow artifact (every build) ─────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-expense-tracker-${{ env.VERSION }}-apk
          path: build/app/outputs/flutter-apk/ai-expense-tracker-*.apk
          retention-days: 30

      # ── 11. Upload AAB as workflow artifact (every build) ─────────────────
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-expense-tracker-${{ env.VERSION }}-aab
          path: build/app/outputs/bundle/release/ai-expense-tracker-*.aab
          retention-days: 30

      # ── 12. Create GitHub Release (tag pushes only) ───────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "AI Expense Tracker ${{ github.ref_name }}"
          body: |
            ## What's new in ${{ github.ref_name }}

            See [CONTRIBUTING.md](CONTRIBUTING.md) for full details.

            ### Downloads
            | File | Description |
            |------|-------------|
            | `ai-expense-tracker-*.apk` | Direct install APK (sideload) |
            | `ai-expense-tracker-*.aab` | App Bundle for Play Store upload |
          files: |
            build/app/outputs/flutter-apk/ai-expense-tracker-*.apk
            build/app/outputs/bundle/release/ai-expense-tracker-*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
